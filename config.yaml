# HALT-RAG settings. Every script and notebook reads from here,
# so one change here changes the whole pipeline.

seed: 42

paths:
  drive_dir: /content/drive/MyDrive/halt_rag_cache   # Colab + Google Drive
  data_dir: data                                     # laptop; relative to the repo root, not in git
  audit_v5: halt_rag_audit_v5.csv                    # the 300 pilot questions
  signals_v5: halt_rag_v5_signals.csv                # output of HALT_RAG_v5_signals.ipynb
  kilt_cache_v6: kilt_cache_v6.pkl                   # output of 02_kilt_scan_wikidata
  kilt_ckpt_v6: kilt_ckpt_v6.pkl
  scan_report_v6: kilt_scan_v6_report.json

questions:
  dataset: akariasai/PopQA
  n_per_band: 150          # pilot; the full study uses 500 + 500
  tail_max_pop: 50         # pilot code used s_pop < 50
  head_min_pop: 500        # pilot code used s_pop > 500

collection:
  kilt_dataset: facebook/kilt_wikipedia
  min_para_chars: 50       # drop paragraphs shorter than this
  passage_words: 100       # join paragraphs into passages of up to this many words
  reservoir_pages: 10000   # random background pages for Lift
  max_para_per_background_page: 40
  checkpoint_every: 200000

retrieval:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  top_k: 5

signals:
  lift_pool: 5000          # random corpus passages used as Lift's baseline
  lift_eps: 1.0e-6         # epsilon in max(sigma, eps)
  qa_model: deepset/roberta-base-squad2
  cas_max_answer_len: 30

eval:
  n_bootstrap: 2000
  ci: 0.95
  lift_relevance_alarm: 0.9   # Step 1 decision rule
