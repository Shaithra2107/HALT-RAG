# HALT-RAG settings. Every script and notebook reads from here,
# so one change here changes the whole pipeline.

seed: 42

paths:
  drive_dir: /content/drive/MyDrive/halt_rag_cache   # Colab + Google Drive
  data_dir: data                                     # laptop; relative to the repo root, not in git
  audit_v5: halt_rag_audit_v5.csv                    # the 300 pilot questions
  audit_1500: halt_rag_audit_1500.csv                # 1,500 questions for the full study (notebook 00)
  signals_v5: halt_rag_v5_signals.csv                # output of HALT_RAG_v5_signals.ipynb
  # Step 2, the 2023 Wikipedia dump (02b_wiki2023_build)
  wiki2023_cache: wiki2023_cache.pkl                 # kilt_pages, distractor_pool, match_method
  wiki2023_report: wiki2023_report.json
  audit_w23: halt_rag_audit_w23.csv                  # audit + m2_status_w23, match_method_w23
  # Step 4, signals on the 2023 collection (03_signals_w23)
  signals_w23: halt_rag_w23_signals.csv
  results_w23: halt_rag_w23_results.json
  corpus_embs_w23: corp_embs_w23.npy                 # cached corpus embeddings (never the v5 ones)
  # Step 3 + hard-negative Lift (04_retrieval_and_hard_lift)
  signals_w23_hard: halt_rag_w23_signals_hard.csv    # signals_w23 + lift_hard, score_gap, gap_hard
  results_w23_hard: halt_rag_w23_hard_results.json
  # Full 1,500-question run (02b + 03 + 04 on halt_rag_audit_1500.csv)
  audit_1500_w23:       halt_rag_audit_1500_w23.csv      # output of 02b on 1,500 questions
  wiki2023_cache_1500:  wiki2023_cache_1500.pkl
  wiki2023_report_1500: wiki2023_report_1500.json
  corpus_embs_1500:     corp_embs_1500.npy               # corpus embeddings for the 1,500-question run
  preprocessing_1500:   preprocessing_1500.json          # paragraph/passage counts from 03
  signals_1500:         halt_rag_1500_signals.csv
  results_1500:         halt_rag_1500_results.json
  signals_1500_hard:    halt_rag_1500_signals_hard.csv   # signals_1500 + lift_hard, score_gap, gap_hard
  results_1500_hard:    halt_rag_1500_hard_results.json
  # Retired: notebook 02 (KILT). KILT no longer loads with the current datasets library.
  kilt_cache_v6: kilt_cache_v6.pkl                   # output of 02_kilt_scan_wikidata
  kilt_ckpt_v6: kilt_ckpt_v6.pkl
  scan_report_v6: kilt_scan_v6_report.json

questions:
  dataset: akariasai/PopQA
  n_per_band: 150          # pilot; the full study uses 750 + 750
  tail_max_pop: 100        # full study: s_pop < 100 (pilot used < 50; only 356 entities exist below 50)
  head_min_pop: 500        # unchanged

collection:
  kilt_dataset: facebook/kilt_wikipedia
  min_para_chars: 50       # drop paragraphs shorter than this
  passage_words: 100       # join paragraphs into passages of up to this many words
  reservoir_pages: 10000   # random background pages stored in the cache
  background_pages_used: 5000   # how many of them the signals run actually uses
  max_para_per_background_page: 40
  checkpoint_every: 200000

retrieval:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  top_k: 5
  top_k_wide: 10           # the wider list: Recall@10 and MRR@10 in notebook 04
  # Two passages this close in score are a tie, not a different result. GPU and CPU
  # round differently, so the same corpus can swap tied passages between runs.
  tie_tol: 1.0e-4

signals:
  lift_pool: 5000          # random corpus passages used as Lift's baseline
  lift_eps: 1.0e-6         # epsilon in max(sigma, eps)
  # lift_hard's background: ranks 21..100 of the question's OWN ranking, after the
  # subject page has been removed. Rank 1-20 are left out so the background is not
  # the retrieval itself; 100 keeps it to passages the retriever still rated highly.
  hard_neg_start: 21
  hard_neg_end: 100
  qa_model: deepset/roberta-base-squad2
  cas_max_answer_len: 30
  lm: google/flan-t5-base  # y_gen generator and the placeholder y_judge (NOT the final judge)

eval:
  n_bootstrap: 2000
  ci: 0.95
  lift_relevance_alarm: 0.9   # Step 1 decision rule
